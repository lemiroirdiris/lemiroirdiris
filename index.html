<style>
:root{color-scheme:dark;--or:#D9B26A;--lav:#B9A8F5;--parme:#EDE6F3;--vio:#34246E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#000;color:var(--parme);font-family:"Cormorant Garamond",Georgia,serif;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:22px 20px 40px;text-align:center}
.logo{width:96px;height:auto;display:block;margin:0 auto 10px}
h1{margin:6px 0 0;font-family:"Cinzel Decorative","Cormorant Garamond",Georgia,serif;font-weight:700;font-size:29px;letter-spacing:.07em;line-height:1.2;color:#9A74F0;background:linear-gradient(180deg,#F1E9FF 0%,#C9B2FF 35%,#9A74F0 70%,#7B52E0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 7px rgba(154,116,240,.8)) drop-shadow(0 0 20px rgba(154,116,240,.6)) drop-shadow(0 0 36px rgba(123,82,224,.35))}
.sub{margin:14px 0 0;font-size:17px;font-weight:600;letter-spacing:.14em;color:#FFFFFF;text-transform:uppercase}
.row{display:flex;align-items:center;gap:14px;margin:22px 0 0}
.row img{width:42%;height:auto;display:block;mix-blend-mode:screen;flex:none}
.btns{flex:1;display:flex;flex-direction:column;gap:12px}
.b{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:14px;padding:13px 10px;font-size:19px;font-weight:700;letter-spacing:.04em;text-decoration:none;border:1px solid #F2A6C8;color:#F2A6C8;background:transparent;font-family:inherit;line-height:1.15;text-align:center}
.b.main{background:#4FA77D;border-color:#4FA77D;color:#fff;text-shadow:0 1px 2px rgba(0,40,20,.4)}
.b.y{background:#D45C94;border-color:#D45C94;color:#fff;text-shadow:0 1px 2px rgba(60,0,30,.4)}
.b.v{background:#6B49C9;border-color:#6B49C9;color:#fff;text-shadow:0 1px 2px rgba(20,0,60,.4)}
.b:focus-visible{outline:3px solid var(--parme);outline-offset:3px}
.pills{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:26px}
.pills span{font-size:17px;font-weight:600;padding:6px 16px;border-radius:999px;border:1px solid #6B49C9;color:var(--parme)}
.by{margin:8px 0 0;font-family:"Cinzel Decorative","Cormorant Garamond",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.1em;color:#9A74F0;background:linear-gradient(180deg,#F1E9FF 0%,#C9B2FF 35%,#9A74F0 70%,#7B52E0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(154,116,240,.8)) drop-shadow(0 0 16px rgba(154,116,240,.55)) drop-shadow(0 0 28px rgba(123,82,224,.3))}
.tag{margin:8px 0 0;font-size:18px;font-style:italic;font-weight:500;color:#C9BEE6;line-height:1.3}
.share{display:inline-flex;align-items:center;gap:8px;margin-top:24px;background:transparent;color:var(--parme);border:1px solid #6e5fa0;border-radius:14px;padding:10px 20px;font:inherit;font-size:18px;font-weight:600;cursor:pointer}
.share:focus-visible{outline:3px solid var(--parme);outline-offset:3px}
.msg{min-height:20px;font-size:15px;color:#F2A6C8;margin:8px 0 0}
.qr{margin:20px auto 0;width:160px;border-radius:14px;overflow:hidden;background:#F6F1FA}
.qr svg{display:block;width:100%;height:auto}
.qrt{font-size:16px;color:#C9BEE6;margin:10px 0 0}
